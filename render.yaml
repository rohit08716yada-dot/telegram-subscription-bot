services:
  - type: web
    name: telegram-subscription-bot
    env: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: python bot.py

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: MONGO_URI
        sync: false

      - key: MONGO_DB_NAME
        value: sub_management

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      - key: ADMIN_ID
        sync: false

      - key: CONTACT_USERNAME
        sync: false

      - key: PUBLIC_BASE_URL
        sync: false

      - key: EXPIRY_CHECK_SECONDS
        value: "60"

      - key: GRACE_MINUTES
        value: "0"

      - key: YOUTUBE_CLIENT_ID
        sync: false

      - key: YOUTUBE_CLIENT_SECRET
        sync: false

      - key: YOUTUBE_REDIRECT_URI
        sync: false

      - key: INSTAGRAM_MODE
        value: manual
